name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latesta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Create signing key
        run: keytool -genkeypair -keystore $HOME/ghadd.jks -storepass ghadd123 -keypass ghadd123 -alias ghadd -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ghadd"
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Ghadd-APK
          path: app/build/outputs/apk/release/*.apk
